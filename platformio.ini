; PlatformIO project configuration for esp32-joystick2trainer
;
; Environments:
;   esp32s3  - firmware for the ESP32-S3 (ESP-IDF, native USB host)
;   native   - hardware independent unit tests, run on the host with `pio test -e native`
;
; Full documentation: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3
description = USB HID joystick to SBUS/CPPM trainer bridge for EdgeTX radios

; Compile-time defaults for the hardware layer. Everything here can also be changed at
; runtime from the serial console and stored in NVS (see docs/configuration.md).
[j2t]
build_flags =
    -DJ2T_SBUS_GPIO=17
    -DJ2T_CPPM_GPIO=18
    -DJ2T_LED_GPIO=-1
    -DJ2T_SBUS_PERIOD_US=14000
    -DJ2T_CPPM_CHANNELS=8
    -DJ2T_CPPM_FRAME_US=22500

[env:esp32s3]
platform = espressif32 @ ^7.1.3
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    ${j2t.build_flags}
    -Wall
    -Wextra
; Firmware-only sources; the pure libraries in lib/ are picked up automatically.
build_src_filter = +<*> -<.git/>
test_ignore = *

[env:native]
platform = native
build_flags =
    ${j2t.build_flags}
    -std=c++17
    -Wall
    -Wextra
    -Wpedantic
    -Wshadow
    -Wconversion
    -Wno-sign-conversion
    -I"${PROJECT_DIR}/test"
test_framework = unity
; Only the pure libraries are compiled for the host; the firmware sources in src/ are not.
build_src_filter = -<*>
