# ESP-IDF Component Manager manifest (https://components.espressif.com).
# PlatformIO downloads these into managed_components/ on the first (clean) build.
# The HID class driver is vendored in components/usb_host_hid (see its NOTICE.md); only the
# USB host library itself comes from the registry (it left the IDF tree in ESP-IDF 6.0).
dependencies:
  espressif/usb: "^1.0.0"
